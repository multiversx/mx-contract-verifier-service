title: config
apps:
  api:
    port: integer
    privatePort: integer
    useCachingInterceptor: boolean
  cacheWarmer:
    port: integer
  queueWorker:
    port: integer
libs:
  common:
    pinata:
      pinataUrl: string
      pinataJwt: string
      fileStorageCdnUrl: string
    network:
      type: string
      enum: [devnet, testnet, mainnet]
    urls:
      api: string
      gateway: string
    database:
      host: string
      port: integer
      username:
        type: string
        required: false
      password:
        type: string
        required: false
      name: string
      tlsAllowInvalidCertificates:
        type: boolean
        default: false
    redis:
      host: string
      port: integer
    security:
      admins:
        type: array
        items: string
        default: []
    rateLimiterSecret:
      type: string
      required: false
